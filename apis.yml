aid: infstones
name: InfStones
description: >-
  InfStones is an enterprise-grade blockchain infrastructure platform providing
  node deployment and management, non-custodial staking, and reliable RPC/JSON-RPC
  API access across 50+ blockchains including Ethereum, BNB Chain, Cosmos, Solana,
  Cardano, Tezos, TRON, and ZetaChain. Developers connect to hosted full and archive
  nodes over standard EVM JSON-RPC, Tendermint, and Cosmos gRPC-REST endpoints
  authenticated by a per-project API key, deploy dedicated validator and staking
  nodes, and query on-chain data through a single unified developer console. The
  platform holds SOC 2 Type I and Type II attestation and serves major exchanges,
  protocols, and institutional clients globally. Backed by Qiming Venture Partners
  and SoftBank Vision Fund.
